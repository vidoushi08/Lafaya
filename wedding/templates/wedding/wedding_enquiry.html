{% extends 'base.html' %}

{% block title %}Wedding Enquiry | Lafaya{% endblock %}

{% block content %}

<section class="wedding-enquiry">

    <h1>Plan Your Dream Wedding</h1>

    <h2>{{ package.name }}</h2>

    <p>{{ package.description }}</p>

    <p>
        Package price: Rs {{ package.price }}
    </p>

    <form method="POST">
        {% csrf_token %}

        <input
            type="hidden"
            name="package"
            value="{{ package.slug }}"
        >

        {{ form.as_p }}

        <button type="submit">
            Submit Enquiry
        </button>
    </form>

</section>

{% endblock %}
