{% extends 'base.html' %}
{% load static %}

{% block title %}Lafaya{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'homepage/css/homepage.css' %}">
{% endblock %}

{% block content %}
  <div class="homepage">
    <section class="homepage-welcome">
      <h1>Leave it all to us</h1>
      <h3>Your personal event management team</h3>
      <button>Book Your Event</button>
    </section>

    <section class="homepage-events-hero">
      <div class="homepage-events-hero-slides">
        <figure class="homepage-events-hero-slide homepage-events-hero-slide-car homepage-events-hero-slide-active">
          <a href="{% url 'car_events:car_events' %}" class="homepage-events-hero-link">
            <img src="{% static 'images/events/cars_main.png' %}" alt="Car Events">
          </a>
          <figcaption class="homepage-events-hero-text">
            <h2>Car Events heading</h2>
            <p>Car Events description text goes here.</p>
          </figcaption>
        </figure>

        <figure class="homepage-events-hero-slide homepage-events-hero-slide-wedding">
          <a href="{% url 'wedding:wedding' %}" class="homepage-events-hero-link">
            <img src="{% static 'images/events/wedding_main.png' %}" alt="Wedding">
          </a>
          <figcaption class="homepage-events-hero-text">
            <h2>Wedding heading</h2>
            <p>Wedding description text goes here.</p>
          </figcaption>
        </figure>

        <figure class="homepage-events-hero-slide homepage-events-hero-slide-concert">
          <a href="{% url 'concert:concert' %}" class="homepage-events-hero-link">
            <img src="{% static 'images/events/concert_main.png' %}" alt="Concert">
          </a>
          <figcaption class="homepage-events-hero-text">
            <h2>Concert heading</h2>
            <p>Concert description text goes here.</p>
          </figcaption>
        </figure>

        <figure class="homepage-events-hero-slide homepage-events-hero-slide-seaside">
          <a href="{% url 'seaside:seaside' %}" class="homepage-events-hero-link">
            <img src="{% static 'images/events/seaside_main.png' %}" alt="Seaside">
          </a>
          <figcaption class="homepage-events-hero-text">
            <h2>Seaside heading</h2>
            <p>Seaside description text goes here.</p>
          </figcaption>
        </figure>

        <figure class="homepage-events-hero-slide homepage-events-hero-slide-conference">
          <a href="{% url 'conference:conference' %}" class="homepage-events-hero-link">
            <img src="{% static 'images/events/conference_main.png' %}" alt="Conference">
          </a>
          <figcaption class="homepage-events-hero-text">
            <h2>Conference heading</h2>
            <p>Conference description text goes here.</p>
          </figcaption>
        </figure>

        <figure class="homepage-events-hero-slide homepage-events-hero-slide-birthday">
          <a href="{% url 'birthday:birthday' %}" class="homepage-events-hero-link">
            <img src="{% static 'images/events/birthday_main.png' %}" alt="Birthday">
          </a>
          <figcaption class="homepage-events-hero-text">
            <h2>Birthday heading</h2>
            <p>Birthday description text goes here.</p>
          </figcaption>
        </figure>
      </div>

      <div class="homepage-events-hero-dots">
        <button type="button" class="homepage-events-hero-dot homepage-events-hero-dot-car homepage-events-hero-dot-active" aria-label="Car Events"></button>
        <button type="button" class="homepage-events-hero-dot homepage-events-hero-dot-wedding" aria-label="Wedding"></button>
        <button type="button" class="homepage-events-hero-dot homepage-events-hero-dot-concert" aria-label="Concert"></button>
        <button type="button" class="homepage-events-hero-dot homepage-events-hero-dot-seaside" aria-label="Seaside"></button>
        <button type="button" class="homepage-events-hero-dot homepage-events-hero-dot-conference" aria-label="Conference"></button>
        <button type="button" class="homepage-events-hero-dot homepage-events-hero-dot-birthday" aria-label="Birthday"></button>
      </div>
    </section>

    <section class="homepage-trusted"></section>

    <section class="homepage-testimonials"></section>

    <footer class="homepage-footer"></footer>
  </div>
{% endblock %}

{% block extra_js %}
  <script src="{% static 'homepage/js/homepage.js' %}"></script>
{% endblock %}
